<div class="modal-backdrop animate-fade-in" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-content glass animate-slide-up" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditMode ? 'Update Product' : 'Add New Product' }}</h2>
      <button class="btn-close" (click)="onClose()">&times;</button>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-group">
        <label for="name">Product Name *</label>
        <input type="text" id="name" formControlName="name" placeholder="e.g. Mechanical Keyboard" [class.error]="isInvalid('name')">
        <div class="error-msg" *ngIf="isInvalid('name')">
          Name is required (max 100 characters).
        </div>
      </div>

      <div class="form-group">
        <label for="category">Category *</label>
        <input type="text" id="category" formControlName="category" placeholder="e.g. Peripherals" [class.error]="isInvalid('category')">
        <div class="error-msg" *ngIf="isInvalid('category')">
          Category is required (max 50 characters).
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="price">Price ($) *</label>
          <input type="number" id="price" formControlName="price" step="0.01" min="0.01" placeholder="0.00" [class.error]="isInvalid('price')">
          <div class="error-msg" *ngIf="isInvalid('price')">
            Price must be greater than 0.
          </div>
        </div>

        <div class="form-group half">
          <label for="stock">Initial Stock *</label>
          <input type="number" id="stock" formControlName="stock" min="0" placeholder="0" [class.error]="isInvalid('stock')">
          <div class="error-msg" *ngIf="isInvalid('stock')">
            Stock cannot be negative.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="3" placeholder="Describe this inventory item..." [class.error]="isInvalid('description')"></textarea>
        <div class="error-msg" *ngIf="isInvalid('description')">
          Description cannot exceed 500 characters.
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="productForm.invalid || productService.loading()">
          {{ productService.loading() ? 'Saving...' : 'Save Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
